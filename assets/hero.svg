<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Ajendra — Full Stack Developer, Security Researcher, AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset=".55" stop-color="#120a2e"/>
      <stop offset="1" stop-color="#1b0b33"/>
    </linearGradient>
    <radialGradient id="sun" cx="930" cy="200" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/>
      <stop offset=".45" stop-color="#8b5cf6" stop-opacity=".18"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#a5f3fc" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#0e7490" stop-opacity=".35"/>
      <stop offset="1" stop-color="#1e1b4b" stop-opacity=".2"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".33" stop-color="#a78bfa"/>
      <stop offset=".66" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity=".75"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="floor"><rect x="0" y="345" width="1200" height="75"/></clipPath>
    <clipPath id="ball"><circle cx="930" cy="190" r="118"/></clipPath>
  </defs>

  <rect width="1200" height="420" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="22" fill="url(#sun)"/>

  <!-- stars -->
  <g fill="#e0e7ff">
    <circle cx="80" cy="40" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="95" r="1"><animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="30" r="1.2"><animate attributeName="opacity" values=".3;1;.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="80" r="1"><animate attributeName="opacity" values="1;.3;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="40" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="60" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="250" r="1"><animate attributeName="opacity" values=".3;1;.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="300" r="1.1"><animate attributeName="opacity" values="1;.3;1" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="140" r=".9"><animate attributeName="opacity" values=".2;.9;.2" dur="5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- synthwave perspective floor -->
  <g clip-path="url(#floor)" stroke="url(#grid)" stroke-width="1.2" fill="none">
    <g>
      <path d="M0 348H1200M0 355H1200M0 365H1200M0 379H1200M0 398H1200M0 422H1200"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 7" dur="1.6s" repeatCount="indefinite"/>
    </g>
    <path d="M600 345L-600 420M600 345L-300 420M600 345L0 420M600 345L200 420M600 345L400 420M600 345L600 420M600 345L800 420M600 345L1000 420M600 345L1200 420M600 345L1500 420M600 345L1800 420"/>
  </g>
  <rect x="0" y="343" width="1200" height="3" fill="#f472b6" opacity=".55" filter="url(#glow)"/>

  <!-- 3D wireframe globe -->
  <circle cx="930" cy="190" r="150" fill="#22d3ee" opacity=".12" filter="url(#softglow)"/>
  <circle cx="930" cy="190" r="118" fill="url(#core)"/>
  <g clip-path="url(#ball)" fill="none" stroke="#67e8f9" stroke-width="1.1" opacity=".75" filter="url(#glow)">
    <ellipse cx="930" cy="190" rx="118" ry="14"/>
    <ellipse cx="930" cy="150" rx="111" ry="13"/>
    <ellipse cx="930" cy="230" rx="111" ry="13"/>
    <ellipse cx="930" cy="112" rx="88" ry="10"/>
    <ellipse cx="930" cy="268" rx="88" ry="10"/>
    <ellipse cx="930" cy="190" rx="118" ry="118"><animate attributeName="rx" values="118;0;118" dur="8s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="930" cy="190" rx="84" ry="118"><animate attributeName="rx" values="84;0;84;118;84" keyTimes="0;.25;.5;.75;1" dur="8s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="930" cy="190" rx="0" ry="118"><animate attributeName="rx" values="0;118;0" dur="8s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="930" cy="190" rx="84" ry="118"><animate attributeName="rx" values="84;118;84;0;84" keyTimes="0;.25;.5;.75;1" dur="8s" repeatCount="indefinite"/></ellipse>
  </g>
  <circle cx="930" cy="190" r="118" fill="none" stroke="#a5f3fc" stroke-width="1.6" opacity=".9"/>
  <circle cx="888" cy="150" r="34" fill="#fff" opacity=".08"/>

  <!-- orbit ring + satellites -->
  <g transform="rotate(-16 930 190)">
    <ellipse cx="930" cy="190" rx="200" ry="48" fill="none" stroke="#f472b6" stroke-width="1.6" stroke-dasharray="6 7" opacity=".85">
      <animate attributeName="stroke-dashoffset" values="0;-130" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <circle r="7" fill="#f9a8d4" filter="url(#glow)">
      <animateMotion dur="7s" repeatCount="indefinite" path="M730 190a200 48 0 1 0 400 0a200 48 0 1 0 -400 0"/>
    </circle>
    <circle r="4.5" fill="#67e8f9" filter="url(#glow)">
      <animateMotion dur="7s" begin="-3.5s" repeatCount="indefinite" path="M730 190a200 48 0 1 0 400 0a200 48 0 1 0 -400 0"/>
    </circle>
  </g>

  <!-- floating code chips -->
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" fill="#e0e7ff">
    <g>
      <rect x="1040" y="70" width="104" height="30" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".6"/>
      <text x="1056" y="90">&lt;/secure&gt;</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="5s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="716" y="290" width="96" height="30" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-opacity=".7"/>
      <text x="732" y="310">ai.run()</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 7;0 0" dur="4.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- left copy -->
  <g font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif">
    <text x="70" y="96" font-size="18" letter-spacing="6" fill="#67e8f9" font-weight="600">HI THERE, I'M</text>
    <text x="66" y="178" font-size="92" font-weight="800" fill="url(#name)" filter="url(#glow)">Ajendra</text>
    <text x="70" y="218" font-size="21" fill="#c7d2fe" font-weight="500">Full Stack Developer · Security Researcher</text>
    <text x="70" y="246" font-size="21" fill="#c7d2fe" font-weight="500">AI Engineer · Startup Advisor</text>
    <g font-size="14" font-weight="600">
      <rect x="70" y="264" width="150" height="30" rx="15" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-opacity=".6"/>
      <text x="92" y="284" fill="#a5f3fc">🛡  Bug Hunter</text>
      <rect x="230" y="264" width="150" height="30" rx="15" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".6"/>
      <text x="252" y="284" fill="#ddd6fe">🤖  AI Builder</text>
      <rect x="390" y="264" width="166" height="30" rx="15" fill="#f472b6" fill-opacity=".14" stroke="#f472b6" stroke-opacity=".6"/>
      <text x="410" y="284" fill="#fbcfe8">🚀  SaaS Founder</text>
    </g>
    <text x="70" y="326" font-size="15" fill="#94a3b8">📍 Uttar Pradesh, India  ·  ajendra.info</text>
  </g>
  <rect x="1" y="1" width="1198" height="418" rx="21" fill="none" stroke="#a78bfa" stroke-opacity=".35"/>
</svg>
