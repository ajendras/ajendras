<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="50+ projects, 5+ years, 30+ clients, 15+ startups helped, 12+ CVEs found">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .c{opacity:0;animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}
    .c:nth-of-type(1){animation-delay:.05s}.c:nth-of-type(2){animation-delay:.2s}.c:nth-of-type(3){animation-delay:.35s}.c:nth-of-type(4){animation-delay:.5s}.c:nth-of-type(5){animation-delay:.65s}
    @keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    .n{font:800 40px 'Segoe UI','Inter',Arial,sans-serif;fill:url(#num)}
    .l{font:600 12px 'Segoe UI','Inter',Arial,sans-serif;fill:#a5b4fc;letter-spacing:2px}
    .i{font:22px 'Segoe UI Emoji','Apple Color Emoji',sans-serif}
  </style>
  <g class="c"><rect x="6" y="10" width="184" height="130" rx="16" fill="url(#card)" stroke="#22d3ee" stroke-opacity=".45"/><text x="98" y="44" text-anchor="middle" class="i">🧩</text><text x="98" y="92" text-anchor="middle" class="n" filter="url(#glow)">50+</text><text x="98" y="120" text-anchor="middle" class="l">PROJECTS</text></g>
  <g class="c"><rect x="208" y="10" width="184" height="130" rx="16" fill="url(#card)" stroke="#818cf8" stroke-opacity=".45"/><text x="300" y="44" text-anchor="middle" class="i">⏳</text><text x="300" y="92" text-anchor="middle" class="n" filter="url(#glow)">5+</text><text x="300" y="120" text-anchor="middle" class="l">YEARS</text></g>
  <g class="c"><rect x="410" y="10" width="184" height="130" rx="16" fill="url(#card)" stroke="#a78bfa" stroke-opacity=".45"/><text x="502" y="44" text-anchor="middle" class="i">🤝</text><text x="502" y="92" text-anchor="middle" class="n" filter="url(#glow)">30+</text><text x="502" y="120" text-anchor="middle" class="l">CLIENTS</text></g>
  <g class="c"><rect x="612" y="10" width="184" height="130" rx="16" fill="url(#card)" stroke="#e879f9" stroke-opacity=".45"/><text x="704" y="44" text-anchor="middle" class="i">🚀</text><text x="704" y="92" text-anchor="middle" class="n" filter="url(#glow)">15+</text><text x="704" y="120" text-anchor="middle" class="l">STARTUPS HELPED</text></g>
  <g class="c"><rect x="814" y="10" width="180" height="130" rx="16" fill="url(#card)" stroke="#f472b6" stroke-opacity=".45"/><text x="904" y="44" text-anchor="middle" class="i">🛡️</text><text x="904" y="92" text-anchor="middle" class="n" filter="url(#glow)">12+</text><text x="904" y="120" text-anchor="middle" class="l">CVES FOUND</text></g>
</svg>
